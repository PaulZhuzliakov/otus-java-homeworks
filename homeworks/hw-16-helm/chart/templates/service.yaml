apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appname }}
spec:
  type: {{ .Values.type }}
  selector:
    app: {{ .Values.appname }}
  ports:
    - protocol: {{ .Values.protocol }}
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      nodePort: {{ .Values.nodePort }}
