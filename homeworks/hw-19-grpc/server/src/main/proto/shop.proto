syntax = "proto3";

package shop;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "hw19.grpc";

message User {
  string email = 1;
  string username = 2;
  int64 id = 3;
}

message Product {
  string name = 1;
  int64 id = 2;
}

message Id {
  int64 value = 1;
}

message ChangeUserEmailRequest {
  int64 id = 1;
  string email = 2;
}

message ChangeUserNameRequest {
  int64 id = 1;
  string username = 2;
}

message AddProductToCartRequest {
  int64 user_id = 1;
  int64 product_id = 2;
}

service Shop {
  rpc createUser(User) returns (Id);
  rpc changeUserEmail(ChangeUserEmailRequest) returns (User);
  rpc changeUserName(ChangeUserNameRequest) returns (User);
  rpc createProduct(Product) returns (Id);
  rpc addProductToCart(AddProductToCartRequest) returns (google.protobuf.Empty);
}
