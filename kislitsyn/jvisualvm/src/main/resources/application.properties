spring.application.name=jvisualvm-web-service-with-login


spring.datasource.url=jdbc:h2:mem:jvisualvm-web-service-with-login
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The baseline run must not contain the intentionally introduced problem.
profiling.redundant-queries.enabled=false
profiling.redundant-queries.count=0
